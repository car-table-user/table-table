<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车型信息表</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background: #f5f5f5;
    margin: 0;
    padding-bottom: 100px;
}
.header {
    background: #1a73e8;
    color: #fff;
    padding: 14px;
    font-size: 20px;
    text-align: center;
    position: sticky;
    top: 0;
}
.search {
    padding: 12px;
    background: #fff;
}
.search input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid #ddd;
    box-sizing: border-box;
}
.card {
    background: #fff;
    margin: 12px;
    padding: 14px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
}
.card h3 {
    margin: 0 0 8px;
    color: #1a73e8;
}
.card p {
    margin: 4px 0;
    font-size: 14px;
    color: #555;
}
.card .btns {
    margin-top: 12px;
    display: flex;
    gap: 12px;
}
.card button {
    flex: 1;
    padding: 10px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
.edit { background: #1a73e8; color: #fff; }
.del { background: #d93025; color: #fff; }

.fab {
    position: fixed;
    right: 20px;
    bottom: 90px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #1a73e8;
    color: #fff;
    font-size: 28px;
    border: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
    z-index: 100;
    cursor: pointer;
}

.panel {
    margin: 12px;
    padding: 14px;
    background: #fff;
    border-radius: 12px;
}
.panel button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #1a73e8;
    color: #fff;
    margin-top: 8px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    justify-content: center;
    align-items: flex-end;
    z-index: 200;
}
.modal.show { display: flex; }
.modal .box {
    background: #fff;
    width: 100%;
    padding: 20px;
    border-radius: 16px 16px 0 0;
    max-height: 85vh;
    overflow: auto;
}
.modal input, .modal textarea {
    width: 100%;
    margin-bottom: 12px;
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid #ddd;
    box-sizing: border-box;
}
.modal button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #1a73e8;
    color: #fff;
    margin-bottom: 10px;
}
.cancel { background: #ccc !important; color: #333 !important; }
</style>
</head>
<body>

<div class="header">🚗 车型信息表</div>

<div class="search">
    <input id="kw" placeholder="🔍 搜索车型 / 内容 / 备注" oninput="render()">
</div>

<div id="list"></div>

<div class="panel">
    <h3>📥 导入 Excel（直接新增）</h3>
    <input type="file" accept=".xlsx,.xls" onchange="importExcel(event)">
</div>

<div class="panel">
    <button onclick="exportExcel()">📊 导出 Excel</button>
    <button onclick="exportTXT()" style="background:#666;">📄 导出 TXT</button>
</div>

<button class="fab" onclick="openForm()">＋</button>

<!-- 表单弹窗 -->
<div class="modal" id="form">
    <div class="box" onclick="event.stopPropagation()">
        <h3 id="formTitle">新增</h3>
        <input id="m" placeholder="车型">
        <textarea id="c" rows="3" placeholder="内容"></textarea>
        <textarea id="r" rows="2" placeholder="备注"></textarea>
        <input id="idx" type="hidden">
        <button onclick="save()">保存</button>
        <button class="cancel" onclick="closeModal()">取消</button>
    </div>
</div>

<!-- 导入预览 -->
<div class="modal" id="imp">
    <div class="box" onclick="event.stopPropagation()">
        <h3>📥 导入预览</h3>
        <div id="impList"></div>
        <button onclick="confirmImport()">✅ 确认新增</button>
        <button class="cancel" onclick="closeModal()">取消</button>
    </div>
</div>

<script>
const KEY = "CAR_V1";
let IMP = [];

function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch { return []; }
}
function save(d) {
    localStorage.setItem(KEY, JSON.stringify(d));
}

/* ===== 渲染 ===== */
function render() {
    const data = load();
    const kw = document.getElementById("kw").value.toLowerCase();
    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach((row, i) => {
        if (kw && !row.join("").toLowerCase().includes(kw)) return;
        const div = document.createElement("div");
        div.className = "card";
        div.dataset.i = i;
        div.innerHTML = `
            <h3>${row[0]}</h3>
            <p>${row[1]}</p>
            <p>${row[2]}</p>
            <div class="btns">
                <button class="edit">✏️ 编辑</button>
                <button class="del">🗑️ 删除</button>
            </div>
        `;
        list.appendChild(div);
    });
}

/* ===== 删除（事件委托，绝对稳） ===== */
document.getElementById("list").addEventListener("click", e => {
    const btn = e.target;
    if (!btn.classList.contains("edit") && !btn.classList.contains("del")) return;

    const card = btn.closest(".card");
    const i = Number(card.dataset.i);
    const data = load();

    if (btn.classList.contains("del")) {
        if (!confirm("确定删除？")) return;
        data.splice(i, 1);
        save(data);
        render();
        return;
    }

    if (btn.classList.contains("edit")) {
        const row = data[i];
        document.getElementById("formTitle").textContent = "编辑";
        document.getElementById("m").value = row[0];
        document.getElementById("c").value = row[1];
        document.getElementById("r").value = row[2];
        document.getElementById("idx").value = i;
        document.getElementById("form").classList.add("show");
    }
});

/* ===== 新增 / 编辑 ===== */
function openForm() {
    document.getElementById("formTitle").textContent = "新增";
    document.getElementById("m").value = "";
    document.getElementById("c").value = "";
    document.getElementById("r").value = "";
    document.getElementById("idx").value = -1;
    document.getElementById("form").classList.add("show");
}

function save() {
    const m = document.getElementById("m").value.trim();
    if (!m) { alert("车型不能为空"); return; }
    const data = load();
    const row = [m, document.getElementById("c").value.trim(), document.getElementById("r").value.trim()];
    const i = Number(document.getElementById("idx").value);
    if (i >= 0) data[i] = row; else data.push(row);
    save(data);
    render();
    closeModal();
}

/* ===== 导入（永远新增 + 预览） ===== */
function importExcel(e) {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
        const arr = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
        IMP = arr.filter(r => r[0]).map(r => [String(r[0]), String(r[1]||""), String(r[2]||"")]);
        document.getElementById("impList").innerHTML =
            `<p>将新增 <strong>${IMP.length}</strong> 条数据：</p>` +
            IMP.map(x => `<p>• ${x[0]}</p>`).join("");
        document.getElementById("imp").classList.add("show");
        e.target.value = "";
    };
    r.readAsArrayBuffer(f);
}

function confirmImport() {
    const data = load();
    save(data.concat(IMP));
    IMP = [];
    render();
    closeModal();
    alert("导入完成");
}

/* ===== 导出 ===== */
function exportExcel() {
    const data = load();
    const ws = XLSX.utils.aoa_to_sheet([["车型","内容","备注"], ...data]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "车型");
    XLSX.writeFile(wb, "车型信息表.xlsx");
}
function exportTXT() {
    const txt = load().map(r => r.join("\t")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], {type:"text/plain"}));
    a.download = "车型信息表.txt";
    a.click();
}

/* ===== 工具 ===== */
function closeModal() {
    document.querySelectorAll(".modal").forEach(m => m.classList.remove("show"));
}
render();
</script>
</body>
</html>
